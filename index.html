<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bourse">
<meta name="robots" content="noindex,nofollow">
<title>Mon suivi bourse</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--mute:#76736c;--line:#e7e4dd;--vert:#1f9d55;--orange:#d98a00;--rouge:#d23c3c;--gris:#b5b1a8;--accent:#1d4ed8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1e1e1c;--ink:#f1efe9;--mute:#9b978e;--line:#2e2d2a;--gris:#5d5a54;--accent:#7aa2ff}}
:root[data-theme="dark"]{--bg:#141413;--card:#1e1e1c;--ink:#f1efe9;--mute:#9b978e;--line:#2e2d2a;--gris:#5d5a54;--accent:#7aa2ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:760px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 40px}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--vert)}.neg{color:var(--rouge)}.mute{color:var(--mute)}
header{margin:6px 0 14px}
.total{font-size:30px;font-weight:700;letter-spacing:-.5px}
.sub{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:13px;margin-top:2px}
.alertes{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.alertes div+div{margin-top:4px}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;white-space:nowrap;border:0;background:transparent;color:var(--mute);font:inherit;font-weight:600;padding:8px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.liste{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ent,.row{display:grid;grid-template-columns:14px 1fr 74px 64px 62px;gap:8px;align-items:center;padding:10px 12px}
.ent{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mute);border-bottom:1px solid var(--line);padding-top:8px;padding-bottom:8px}
.ent span,.row .r{text-align:right}
.ent.p4,.row.p4{grid-template-columns:14px 1fr 68px 54px 60px 56px}
.row{border-top:1px solid var(--line);cursor:pointer}
.row:first-of-type{border-top:0}
.row.c-CTO,.det.c-CTO{background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.row.c-NOMINATIF,.det.c-NOMINATIF{background:color-mix(in srgb,#c9a227 18%,var(--card))}
.jauge{grid-column:2/-1;height:3px;background:var(--line);border-radius:2px;margin-top:-2px;overflow:hidden}
.jauge i{display:block;height:100%;border-radius:2px}
.jauge i.vert{background:var(--vert)}.jauge i.orange{background:var(--orange)}.jauge i.rouge{background:var(--rouge)}
.section{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:9px 12px;font-size:13px;font-weight:700;border-top:1px solid var(--line);background:color-mix(in srgb,var(--line) 45%,var(--card))}
.section span{font-weight:500;color:var(--mute)}
.ptab{width:100%;border-collapse:collapse;font-size:13px}.ptab td.num,.ptab td:nth-child(2){white-space:nowrap}
.ptab th,.ptab td{padding:8px 7px;text-align:right;border-top:1px solid var(--line)}
.ptab th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mute);font-weight:600}
.ptab td:first-child,.ptab th:first-child{text-align:left}
.bloc{padding:10px 12px}
.bloc h3{font-size:13px;margin:4px 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.4px}
.score{display:inline-block;min-width:34px;text-align:center;font-weight:700;border-radius:8px;padding:3px 0;font-size:14px}
.score.vert{background:color-mix(in srgb,var(--vert) 18%,var(--card));color:var(--vert)}
.score.orange{background:color-mix(in srgb,var(--orange) 18%,var(--card));color:var(--orange)}
.score.gris{background:var(--line);color:var(--mute)}
.barres div{display:grid;grid-template-columns:110px 1fr 46px;gap:8px;align-items:center;font-size:13px;margin:3px 0}
.barres .b{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.barres .b i{display:block;height:100%}
.tag2{font-size:10px;font-weight:700;padding:1px 5px;border-radius:5px;background:var(--accent);color:#fff;margin-left:4px;vertical-align:1px}
.cpt{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 3px 0 8px;vertical-align:-1px;border:1px solid var(--line)}
.row:hover{background:color-mix(in srgb,var(--line) 35%,transparent)}
.dot{width:10px;height:10px;border-radius:50%}
.dot.vert{background:var(--vert)}.dot.orange{background:var(--orange)}.dot.rouge{background:var(--rouge)}.dot.gris{background:var(--gris)}
.nom{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nom small{display:block;font-weight:400;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r b{display:block;white-space:nowrap}.r small{white-space:nowrap}.r small{color:var(--mute);font-size:12px}
.det{display:none;padding:4px 14px 14px 34px;border-top:1px dashed var(--line);font-size:14px}
.det.on{display:block}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 16px;margin:8px 0}
.kv div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:3px 0}
.kv span{color:var(--mute)}
.msg{margin:6px 0;font-weight:600}
.msg.rouge{color:var(--rouge)}.msg.orange{color:var(--orange)}
.fiches{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:8px}
.fiche{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.fiche h4{margin:0 0 4px;font-size:13px;display:flex;justify-content:space-between}
.fiche ul{margin:6px 0 0;padding-left:16px;color:var(--mute)}
.tag{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--line);color:var(--ink);font-weight:600}
.graph{margin:10px 0 4px}
.graph svg{width:100%;height:auto;display:block}
.graph .per{display:flex;gap:6px;justify-content:flex-end;margin-bottom:4px}
.graph .per button{border:1px solid var(--line);background:var(--card);color:var(--mute);font:inherit;font-size:12px;padding:2px 10px;border-radius:6px;cursor:pointer}
.graph .per button.on{color:var(--ink);border-color:var(--ink)}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mute);margin-top:4px}
.leg i{display:inline-block;width:14px;border-top:2px dashed;vertical-align:middle;margin-right:4px}
.vide{padding:16px;color:var(--mute);text-align:center}
.pied{color:var(--mute);font-size:12px;margin-top:14px;text-align:center}
#porte{max-width:320px;margin:22vh auto 0;text-align:center}
#porte input{width:100%;font-size:22px;text-align:center;letter-spacing:2px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
#porte button{margin-top:10px;width:100%;padding:12px;font:inherit;font-weight:600;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
#err{color:var(--rouge);min-height:20px;margin-top:8px}
@media (max-width:420px){.ent.p4,.row.p4{grid-template-columns:9px 1fr 56px 46px 50px 46px;gap:5px}.ent,.row{grid-template-columns:10px 1fr 66px 60px 52px;gap:6px;padding:9px 10px}.row .r b{font-size:14px}.r small{font-size:11px}.seg button{font-size:12px;padding:8px 2px}.total{font-size:26px}}
</style>
</head>
<body>
<main>
<div id="porte">
  <h2>Mon suivi bourse</h2>
  <input id="code" type="password" autocomplete="current-password" placeholder="Code" aria-label="Code d'accès">
  <button id="ok">Ouvrir</button>
  <div id="err"></div>
</div>
<div id="app" hidden></div>
</main>

async function dechiffrer(code) {
  const te = new TextEncoder(), S = crypto.subtle;
  const base = await S.importKey("raw", te.encode(code), "PBKDF2", false, ["deriveBits"]);
  const k = new Uint8Array(await S.deriveBits({name: "PBKDF2", salt: b64(ENC.sel), iterations: ENC.iter, hash: "SHA-256"}, base, 512));
  const hk = raw => S.importKey("raw", raw, {name: "HMAC", hash: "SHA-256"}, false, ["sign"]);
  const kEnc = await hk(k.slice(0, 32)), kMac = await hk(k.slice(32));
  const nonce = b64(ENC.nonce), ct = b64(ENC.ct), tag = new Uint8Array(await S.sign("HMAC", kMac, cat(nonce, ct)));
  const att = b64(ENC.tag);
  if (tag.length !== att.length || tag.some((v, i) => v !== att[i])) throw new Error("code");
  const n = Math.ceil(ct.length / 32), blocs = [];
  for (let i = 0; i < n; i++) { const c = new Uint8Array(4); new DataView(c.buffer).setUint32(0, i); blocs.push(S.sign("HMAC", kEnc, cat(nonce, c))); }
  const flux = (await Promise.all(blocs)).map(b => new Uint8Array(b));
  const out = ct.map((v, i) => v ^ flux[i >> 5][i & 31]);
  return JSON.parse(new TextDecoder().decode(out));
}
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

const fr = (x, d = 2) => x == null ? "—" : x.toLocaleString("fr-FR", {minimumFractionDigits: d, maximumFractionDigits: d});
const eurK = x => x == null ? "" : Math.abs(x) >= 1000 ? (x / 1000).toLocaleString("fr-FR", {maximumFractionDigits: 1}) + " k€" : Math.round(x) + " €";
const eur = x => x == null ? "—" : Math.round(x).toLocaleString("fr-FR") + " €";
const pct = (x, d = 1) => x == null ? "—" : (x > 0 ? "+" : "") + fr(x * 100, d) + " %";
const pctC = x => x == null ? "—" : pct(x, Math.abs(x) >= 0.1 ? 0 : 1);
const pctA = x => x == null ? "—" : x > 9.99 ? "> +999 %" : pct(x, 0);
const cls = x => x == null ? "" : x >= 0 ? "pos" : "neg";
const dev = d => !d || d === "EUR" ? "€" : d === "USD" ? "$" : d;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const dateFr = s => s ? s.split("-").reverse().join("/") : "—";

function fiches(avis, devise) {
  if (!avis || !avis.length) return '<div class="mute" style="margin-top:6px">Aucun avis BNP enregistré.</div>';
  return '<div class="fiches">' + avis.map(a => {
    const zone = a.dec ? `clôture ${a.dec[7]} ${fr(+a.dec.slice(8))}` :
      (a.zone[0] || a.zone[1]) ? `${fr(a.zone[0] ?? a.zone[1])} – ${fr(a.zone[1] ?? a.zone[0])}` : "au cours";
    return `<div class="fiche"><h4><span>${esc(a.an)}</span><span class="tag">${esc(a.sens || "?")}</span></h4>
      Entrée : <b>${zone}</b><br>Objectif : <b>${fr(a.obj)}</b> · Stop : <b>${fr(a.stop)}</b> ${dev(devise)}
      <div class="mute" style="font-size:12px">Avis du ${dateFr(a.date)}${a.recent ? "" : " (ancien)"}</div>
      ${a.hist.length ? "<ul>" + a.hist.map(h => `<li>${dateFr(h[0])} : ${esc(h[1])}</li>`).join("") + "</ul>" : ""}</div>`;
  }).join("") + "</div>";
}

function lignePos(p, i) {
  const stop = p.compte === "NOMINATIF" ? '<b class="mute">—</b><small>LT</small>' : p.stop == null ? '<b class="neg">aucun</b>' : `<b>${pct(p.dist_stop, 0)}</b><small>${fr(p.stop)}${p.suiveur ? " ↑" : ""}</small>`;
  return `<div class="row p4 c-${p.compte}" data-i="p${i}"><div class="dot ${p.voyant}"></div>
    <div class="nom">${esc(p.court || p.nom)}<small>${p.jours > 730 ? fr(p.jours / 365, 1) + " ans" : p.jours + " j"} · ${eurK(p.valeur)}</small></div>
    <div class="r num ${cls(p.perf)}"><b>${pctC(p.perf)}</b><small>${eurK(p.latent)}</small></div>
    <div class="r num"><b class="${cls(p.var_jour)}">${pct(p.var_jour)}</b><small class="${cls(p.var_jour)}">${p.var_jour == null || p.valeur == null ? "" : eurK(p.valeur * p.var_jour / (1 + p.var_jour))}</small></div>
    <div class="r num"><b class="${cls(p.annuel)}">${pctA(p.annuel)}</b><small>${p.annuel == null ? "< 3 mois" : ""}</small></div>
    <div class="r num">${stop}</div>
    ${p.compte === "NOMINATIF" ? "" : `<div class="jauge" title="distance au stop"><i class="${p.dist_stop == null ? "rouge" : p.dist_stop < 0.03 ? "rouge" : p.dist_stop < 0.06 ? "orange" : "vert"}" style="width:${p.dist_stop == null ? 100 : Math.max(4, Math.min(100, p.dist_stop / 0.25 * 100))}%"></i></div>`}</div>
  <div class="det c-${p.compte}" id="p${i}">
    ${p.msg ? `<div class="msg ${p.voyant}">${esc(p.msg)}</div>` : ""}
    <div class="kv">
      <div><span>Cours</span><b class="num">${fr(p.cours)} ${dev(p.devise)} <small class="${cls(p.var_jour)}">${pct(p.var_jour)}</small></b></div>
      <div><span>PRU</span><b class="num">${fr(p.pru)} €</b></div>
      <div><span>Quantité</span><b class="num">${p.qte}</b></div>
      <div><span>Valeur</span><b class="num">${eur(p.valeur)}</b></div>
      <div><span>Acheté le</span><b>${dateFr(p.date_achat)}</b></div>
      <div><span>Sur 30 jours</span><b class="num ${cls(p.perf30)}">${pct(p.perf30)}</b></div>
      <div><span>Stop${p.suiveur ? " suiveur" : ""}</span><b class="num">${p.stop == null ? "aucun" : fr(p.stop) + " " + dev(p.devise)}${p.suiveur && p.suiveur_pct ? ` <small class="mute">(−${fr(p.suiveur_pct * 100, 1)} %, estimé)</small>` : ""}</b></div>
      <div><span>ISIN</span><b>${esc(p.isin)}</b></div>
    </div>
    ${graphique(p.ticker.split("|")[0], [{v: p.pru_dev, t: "prix d'achat", c: "achat"}, {v: p.stop, t: p.suiveur ? "stop suiveur" : "stop", c: "stop"}].concat(niveauxAvis(p.avis).filter(n => n.c === "obj")), p.date_achat)}
    ${p.stop_note ? `<div class="mute">${esc(p.stop_note)}</div>` : ""}
    ${fiches(p.avis, p.devise)}
  </div>`;
}

function ligneProp(p, i) {

// ---------- Graphique : cours 3 ou 6 mois + niveaux (achat, stop, objectifs, limite)
let periode = +(lsGet("periode") || 6);
const COUL = {achat: "var(--accent)", stop: "var(--rouge)", obj: "var(--vert)", entree: "var(--orange)"};
function niveauxAvis(avis) {
  const out = [];
  (avis || []).filter(a => a.recent).forEach(a => {
    const qui = a.an.split(" ").pop();
    if (a.obj) out.push({v: a.obj, t: `objectif ${qui}`, c: "obj"});
    if (a.dec) out.push({v: +a.dec.slice(8), t: `clôture ${a.dec[7]} (${qui})`, c: "entree"});
    else if (a.zone[0] || a.zone[1]) out.push({v: a.zone[1] ?? a.zone[0], t: `entrée ${qui}`, c: "entree"});
  });
  return out;
}
function graphique(ticker, niveaux, dateAchat) {
  const serie = (D.series || {})[ticker];
  if (!serie || serie.length < 5) return "";
  const debut = new Date(); debut.setMonth(debut.getMonth() - periode);
  const pts = serie.filter(x => new Date(x[0]) >= debut);
  if (pts.length < 2) return "";
  const W = 600, H = 230, g = 8, dr = 118;
  const vals = pts.map(x => x[1]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const visibles = [], horsCadre = [];
  niveaux.filter(n => n.v).forEach(n => (n.v > lo * 0.75 && n.v < hi * 1.3 ? visibles : horsCadre).push(n));
  visibles.forEach(n => { lo = Math.min(lo, n.v); hi = Math.max(hi, n.v); });
  const pad = (hi - lo) * 0.08 || hi * 0.02; lo -= pad; hi += pad;
  const X = i => g + i * (W - g - dr) / (pts.length - 1), Y = v => 14 + (H - 34) * (1 - (v - lo) / (hi - lo));
  const path = pts.map((x, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(x[1]).toFixed(1)}`).join("");
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cours sur ${periode} mois">`;
  [0.25, 0.5, 0.75].forEach(f => svg += `<line x1="${g}" x2="${W - dr}" y1="${14 + (H - 34) * f}" y2="${14 + (H - 34) * f}" stroke="var(--line)"/>`);
  const ia = dateAchat ? pts.findIndex(x => x[0] >= dateAchat) : -1;
  if (ia > 0) svg += `<line x1="${X(ia)}" x2="${X(ia)}" y1="10" y2="${H - 20}" stroke="var(--accent)" stroke-dasharray="2 4"/><text x="${X(ia) + 4}" y="${H - 22}" font-size="15" fill="var(--accent)">achat</text>`;
  const etiquettes = [];
  visibles.sort((a, b) => b.v - a.v).forEach(n => {
    const y = Y(n.v);
    svg += `<line x1="${g}" x2="${W - dr}" y1="${y}" y2="${y}" stroke="${COUL[n.c]}" stroke-width="1.6" stroke-dasharray="6 5"/>`;
    let ye = y + 5; if (etiquettes.length && ye - etiquettes[etiquettes.length - 1] < 16) ye = etiquettes[etiquettes.length - 1] + 16;
    etiquettes.push(ye);
    svg += `<text x="${W - dr + 6}" y="${ye}" font-size="15" fill="${COUL[n.c]}">${fr(n.v)}</text>`;
  });
  svg += `<path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round"/>`;
  const last = pts[pts.length - 1];
  svg += `<circle cx="${X(pts.length - 1)}" cy="${Y(last[1])}" r="4" fill="var(--ink)"/>`;
  svg += `<text x="${g}" y="${H - 4}" font-size="14" fill="var(--mute)">${dateFr(pts[0][0])}</text><text x="${W - dr}" y="${H - 4}" font-size="14" fill="var(--mute)" text-anchor="end">${dateFr(last[0])}</text></svg>`;
  const vus = new Set();
  const leg = visibles.concat(horsCadre).filter(n => { const k = n.t; if (vus.has(k)) return false; vus.add(k); return true; })
    .map(n => `<span><i style="border-color:${COUL[n.c]}"></i>${esc(n.t)} ${fr(n.v)}${horsCadre.includes(n) ? " (hors cadre)" : ""}</span>`).join("");
  return `<div class="graph"><div class="per">${[3, 6, 12].map(m => `<button data-per="${m}" class="${m === periode ? "on" : ""}">${m === 12 ? "1 an" : m + " mois"}</button>`).join("")}</div>${svg}<div class="leg">${leg}</div></div>`;
}

let D, vue = lsGet("vue") || "pos";
const RANG = {rouge: 0, orange: 1, vert: 2};
const NOMS_COMPTES = {PEA: "PEA", CTO: "Compte titres", NOMINATIF: "Nominatif pur"};
function vuePositions(pos) {

    html += lignes.map(([p, i]) => lignePos(p, i)).join("");

  return html;

    ${l.manque && l.manque.length ? `<div class="mute" style="font-size:12px">Données manquantes : ${esc(l.manque.join(", "))}</div>` : ""}

function vueRadar() {
  const R = D.radar || {};
  if (!R.lignes || !R.lignes.length) return '<div class="vide">Radar pas encore calculé (premier calcul ce soir après la clôture)</div>';

  const secteurs = `<div class="bloc"><h3>Secteurs sur 3 mois (médiane de l'univers)</h3><div class="barres">${S.map(x => `<div><span>${esc(x.secteur)}</span><span class="b"><i style="width:${Math.abs(x.perf3m) / m * 100}%;background:${x.perf3m >= 0 ? "var(--vert)" : "var(--rouge)"}"></i></span><span class="num ${cls(x.perf3m)}">${pct(x.perf3m, 0)}</span></div>`).join("")}</div></div>`;
  return secteurs + `<div class="ent p4"><i></i><b>Valeur décotée</b><span>Score</span><span>Chute</span><span>Bénéf.</span><span>Object.</span></div>`
    + R.lignes.map(ligneRadar).join("")
    + `<div class="bloc mute" style="font-size:12px">${R.nb} valeurs analysées le ${esc(R.maj || "")}. Score /100 : chute du cours (25), prévisions de bénéfice sur 3 mois (30), PER vs secteur (15), objectif des analystes (15), qualité (15), avis experts (10), ramené sur 100. 🟢 = score ≥ 60 et reprise technique · 🟠 = attendre la reprise. Taille calculée pour risquer ≈ 1 400 € au stop.</div>`;
}

let compteP = lsGet("compteP") || "TOUS";
function vuePerf() {
  const P = (D.perf || {})[compteP];
  if (!P) return '<div class="vide">Performance indisponible</div>';
  const base = compteP === "TOUS" ? D.total + (D.nominatif ? D.nominatif.valeur : 0) : ((D.comptes[compteP] || {}).valeur || 0) + ((D.comptes[compteP] || {}).especes || 0);
  const lignes = P.periodes.map(x => {
    const dep = base - x.total, p = dep > 0 ? x.total / dep : null;
    return `<tr><td>${esc(x.nom)}</td><td class="num ${cls(x.realise)}">${eurK(x.realise) || "0 €"}</td><td class="num ${cls(x.latent)}">${eurK(x.latent)}</td><td class="num ${cls(x.total)}"><b>${eurK(x.total)}</b></td><td class="num ${cls(p)}">${pct(p)}</td></tr>`;
  }).join("");
  // barres mensuelles
  const M = P.mois, W = 600, H = 190, max = Math.max(1, ...M.map(m => Math.abs(m.total))), bw = (W - 20) / M.length;
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Résultat mensuel"><line x1="10" x2="${W - 10}" y1="${H / 2}" y2="${H / 2}" stroke="var(--line)"/>`;
  M.forEach((m, i) => {
    const h = Math.abs(m.total) / max * (H / 2 - 22), x = 10 + i * bw + bw * 0.15, y = m.total >= 0 ? H / 2 - h : H / 2;
    svg += `<rect x="${x}" y="${y}" width="${bw * 0.7}" height="${Math.max(1, h)}" rx="3" fill="${m.total >= 0 ? "var(--vert)" : "var(--rouge)"}"/>`;
    svg += `<text x="${x + bw * 0.35}" y="${H - 4}" font-size="13" text-anchor="middle" fill="var(--mute)">${m.mois.slice(5)}/${m.mois.slice(2, 4)}</text>`;
    if (Math.abs(m.total) >= max * 0.25) svg += `<text x="${x + bw * 0.35}" y="${m.total >= 0 ? y - 4 : y + h + 13}" font-size="12" text-anchor="middle" fill="var(--mute)">${(m.total / 1000).toLocaleString("fr-FR", {maximumFractionDigits: 1})}k</text>`;
  });
  svg += "</svg>";
  const ventes = P.ventes.map(v => `<tr><td>${esc(v.nom)} <small class="mute">${esc(v.compte)}</small></td><td>${dateFr(v.date_vente)}</td><td class="num ${cls(v.realise_eur)}">${eurK(v.realise_eur)}</td></tr>`).join("");
  return `<div class="bloc"><div class="per" style="display:flex;gap:6px;flex-wrap:wrap">${["TOUS", "PEA", "CTO", "NOMINATIF"].map(c => `<button data-cpt="${c}" class="${c === compteP ? "on" : ""}" style="border:1px solid var(--line);background:var(--card);color:${c === compteP ? "var(--ink)" : "var(--mute)"};border-color:${c === compteP ? "var(--ink)" : "var(--line)"};font:inherit;font-size:13px;padding:4px 10px;border-radius:7px;cursor:pointer">${c === "TOUS" ? "Tous" : NOMS_COMPTES[c]}</button>`).join("")}</div></div>
    <table class="ptab"><tr><th>Période</th><th>Réalisé</th><th>Latent</th><th>Total</th><th>%</th></tr>${lignes}</table>
    <div class="bloc"><h3>Résultat par mois (12 mois)</h3><div class="graph">${svg}</div></div>
    ${ventes ? `<div class="bloc"><h3>Dernières ventes (plus-value réalisée)</h3><table class="ptab">${ventes}</table></div>` : ""}
    <div class="bloc mute" style="font-size:12px">Réalisé = plus-values des ventes de la période (prix d'achat → prix de vente). Latent = évolution des lignes détenues sur la période. Hors dividendes et frais ; % approximatif (versements non pris en compte).</div>`;
}

    <button data-v="prop" class="${vue === "prop" ? "on" : ""}">Idées${nbVert ? ` ${nbVert}🟢` : ""}</button>

      : `<div class="ent"><i></i><b>Valeur · condition</b><span>Cours</span><span>Jour</span><span>Écart</span></div>` + (props.map(ligneProp).join("") || '<div class="vide">Aucune proposition récente</div>')}

document.addEventListener("click", e => {
  const cp = e.target.closest("[data-cpt]");
  if (cp) { compteP = cp.dataset.cpt; lsSet("compteP", compteP); rendre(); return; }
  const per = e.target.closest("[data-per]");
  if (per) {
    periode = +per.dataset.per; lsSet("periode", periode);
    const ouverts = [...document.querySelectorAll(".det.on")].map(d => d.id);
    rendre(); ouverts.forEach(id => document.getElementById(id)?.classList.add("on")); return;
  }
  const b = e.target.closest(".seg button");
  if (b) { vue = b.dataset.v; lsSet("vue", vue); rendre(); return; }
  const r = e.target.closest(".row");
  if (r) document.getElementById(r.dataset.i).classList.toggle("on");
});
async function ouvrir(code, auto) {
  try {
    D = await dechiffrer(code);
    lsSet("code", code);
    document.getElementById("porte").hidden = true;
    document.getElementById("app").hidden = false;
    rendre();
  } catch (e) {
    if (!auto) document.getElementById("err").textContent = "Code incorrect";
  }
}
document.getElementById("ok").onclick = () => ouvrir(document.getElementById("code").value);
document.getElementById("code").addEventListener("keydown", e => { if (e.key === "Enter") ouvrir(e.target.value); });
async function verifierMaj() {
  if (location.protocol === "file:") return;
  try {
    const r = await fetch(location.pathname + "?t=" + Date.now(), {cache: "no-store"});
    const m = (await r.text()).match(/"nonce": "([^"]*)"/);
    if (m && ENC && m[1] !== ENC.nonce) location.replace(location.pathname + "?v=" + Date.now());
  } catch (e) {}
